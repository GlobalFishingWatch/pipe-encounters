# Production inputs of core.ais.v5's merge_encounters, on 1 month,
# to compare the distance filter in SQL with the Python one (PIPELINE-4709).
# Query parameters:
bq_in_partial_encounters: "gfw-int-ais-datalake.encounters_v1.raw_encounters"
bq_in_segment_info:
  - "global-fishing-watch.pipe_ais_v3_published.segment_info"
bq_in_spatial_measures: "global-fishing-watch.pipe_static.spatial_measures_clustered_v20260403"
bq_out_encounters: "world-fishing-827.scratch_tomas_ttl30d.encounters_4709_month_new"
start_date: "2026-09-01"
end_date: "2026-10-01"
bad_segs: >-
  (SELECT DISTINCT seg_id FROM `gfw-int-ais-datalake.summarized_positions_v1.segs_activity`
  WHERE overlapping_and_short)
min_hours_between_encounters: 4

# Apache Beam / Dataflow options:
project: world-fishing-827
runner: DataflowRunner
max_num_workers: 20
worker_machine_type: e2-custom-2-10240
region: us-central1
subnetwork: regions/us-central1/subnetworks/gfw-internal-us-central1
service_account_email: engineering-development@world-fishing-827.iam.gserviceaccount.com
temp_location: "gs://gfw-dataflow-temp-staging-ttl-7/encounters/temp"
staging_location: "gs://gfw-dataflow-temp-staging-ttl-7/encounters/staging"
setup_file: "./setup.py"
job_name: encounters-1-month-4709-new

# Labels for cost tracking (label values: lowercase letters, digits, '_' and '-').
labels:
  environment: development
  resource_creator: tomas-link
  project: ais
  stage: encounters

services:
  gcloud:
    image: google/cloud-sdk:latest
    volumes:
      - "gcp:/root/.config/"
    entrypoint: gcloud

  pipeline:
    image: gfw/pipe-encounters-dev
    build:
      target: dev
    volumes:
      - ".:/opt/project"
      - "gcp:/root/.config/"
    entrypoint: "pipe-encounters"

  dev: &dev
    image: gfw/pipe-encounters-dev
    build:
      target: dev
    volumes:
      - ".:/opt/project"
      - "gcp:/root/.config/"
    entrypoint: /bin/bash

  dev_no_gcp:
    image: gfw/pipe-encounters-dev
    # Dev container without GCP credentials.
    <<: *dev
    volumes:
      - ".:/opt/project"

  prod:
    image: gfw/pipe-encounters-prod
    build:
      target: prod
    entrypoint: /bin/bash

  test:
    image: gfw/pipe-encounters-test
    # Runs tests using the production Docker image.
    # Intended to be executed in the GitHub CI environment.
    build:
      target: test
    entrypoint: "pytest -v"

# Volume to hold GCP authentication
volumes:
  gcp:
    external: true
